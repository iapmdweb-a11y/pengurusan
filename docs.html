<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pengurusan Patologi: Dokumen ISO</title>
<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#1c2430;--mu:#667085;--bd:#e2e6ec;--ac:#0f766e;--wa:#b45309;--er:#b91c1c;--ok:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--cd:#1b222b;--tx:#e8ecf1;--mu:#98a2b3;--bd:#2c3642;--ac:#2dd4bf;--wa:#fbbf24;--er:#f87171;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#12161c;--cd:#1b222b;--tx:#e8ecf1;--mu:#98a2b3;--bd:#2c3642;--ac:#2dd4bf;--wa:#fbbf24;--er:#f87171;--ok:#4ade80}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 10px}h2{font-size:15px;margin:0 0 8px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button,.b{border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
.tabs button.on,.b.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.b.d{color:var(--er)}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}th{color:var(--mu);font-weight:600;font-size:12px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;max-width:100%;box-sizing:border-box}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
label{display:block;font-size:12px;color:var(--mu)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;min-width:100px}.bar i{display:block;height:100%}
.al{padding:8px 10px;border-radius:8px;margin-bottom:6px;border-left:4px solid var(--wa);background:var(--bg)}
.al.e{border-color:var(--er)}.al.i{border-color:var(--ac)}
.tg{font-size:11px;padding:1px 6px;border-radius:10px;border:1px solid var(--bd);color:var(--mu)}
.er{color:var(--er)}.wa{color:var(--wa)}.ok{color:var(--ok)}.mu{color:var(--mu)}
.m{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.m>div{background:var(--cd);border-radius:10px;padding:16px;max-width:420px;width:100%}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.k div{background:var(--bg);border-radius:8px;padding:8px}.k b{font-size:16px;display:block}
</style></head><body><div class="w"><div style="display:flex;justify-content:space-between;flex-wrap:wrap" class="mu"><span><b>Pengurusan Patologi</b> &middot; <span id="lnk"><a href="/">Bajet</a> &middot; </span><b>Dokumen ISO</b></span><span id="bar"></span></div><h1>📄 Dokumen ISO</h1><div id="v"><div class="c">Loading…</div></div></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function j(u,o){const r=await fetch(u+(u.includes('?')?'&':'?')+'vote=DOC',o&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});let t={};try{t=await r.json()}catch(e){}if(r.status===401){const e=new Error('auth');e.code=401;throw e}if(!r.ok)throw new Error(t.error||'Error '+r.status);return t}
const CATS=['Quality Manual','Policy','SOP','Work Instruction','Form','External Document','Memo','Other'],SECS=['All sections','Biokimia','Hematologi','Mikrobiologi','Histositologi','Bank Darah','POCT','Pengurusan'];
let me,D=[],K=[],U=[],F={q:'',cat:'',sec:'',st:'Approved',unread:false},form=null,ver=0;
const p2=n=>String(n).padStart(2,'0'),fmt=x=>x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate()),today=()=>fmt(new Date());
const dleft=d=>Math.ceil((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5),addM=(d,n)=>{const x=new Date(d+'T00:00');x.setMonth(x.getMonth()+n);return fmt(x)};
const acked=d=>K.some(k=>k.uid===me.id&&k.doc===d.id);
function loginUI(){$('v').innerHTML='<div class="c" style="max-width:340px;margin:40px auto"><h2>Sign in</h2><label>Username</label><input id="lu1" style="width:100%"><label style="margin-top:8px">Password</label><input id="lp1" type="password" style="width:100%"><p><button class="b p" id="lb">Sign in</button></p><p id="le" class="er"></p></div>';
 const go=async()=>{try{await j('/api/login',{username:$('lu1').value,password:$('lp1').value});location.reload()}catch(e){$('le').textContent=e.message}};$('lb').onclick=go;$('lp1').onkeydown=e=>{if(e.key==='Enter')go()}}
window.outx=async()=>{await j('/api/logout',{});location.reload()};
window.chpw=async()=>{const o=prompt('Current password'),n=o&&prompt('New password (8 or more characters)');if(!n)return;try{await j('/api/password',{old:o,new:n});alert('Password changed.')}catch(e){alert(e.message)}};
async function load(){D=(await j('/api/col?name=isodocs')).docs.map(x=>({id:x.id,...x.data}));K=(await j('/api/col?name=isoacks')).docs.map(x=>x.data);if(me.canEdit)U=(await j('/api/users')).users.filter(u=>u.active);draw()}
async function boot(){try{me=await j('/api/me')}catch(e){return loginUI()}
 if(me.role==='staff')$('lnk').style.display='none';
 $('bar').innerHTML=esc(me.name)+' &middot; <a href="#" onclick="chpw();return false">Change password</a> &middot; <a href="#" onclick="outx();return false">Sign out</a>';
 await load();setInterval(async()=>{try{const v=(await j('/api/ver')).v;if(v!==ver){ver=v;if(!form)load()}}catch(e){if(e.code===401)location.reload()}},4000)}
function draw(){const A=me.canEdit,al=[],ap=D.filter(d=>d.status==='Approved');
 if(A)ap.forEach(d=>{const n=dleft(d.review);if(n<0)al.push(['e',`${esc(d.no)} v${esc(d.ver)} "${esc(d.title)}": review overdue by ${-n} days.`]);else if(n<=60)al.push(['w',`${esc(d.no)} v${esc(d.ver)} "${esc(d.title)}": review due in ${n} days (${esc(d.review)}).`])});
 const unr=ap.filter(d=>!acked(d)).length,sel=(arr,cur,fn)=>arr.map(c=>`<option ${cur===c?'selected':''}>${c}</option>`).join('');
 $('v').innerHTML=(form?formCard():'')+(al.length?`<div class="c"><h2>Reviews due</h2>${al.map(x=>`<div class="al ${x[0]}">${x[1]}</div>`).join('')}</div>`:'')+(unr?`<div class="al i"><b>${unr}</b> approved document(s) not marked as read by you yet.</div>`:'')+
 `<div class="c"><div class="g"><div style="grid-column:span 2"><label>Search (number, title, keywords)</label><div style="display:flex;gap:6px"><input id="qs" value="${esc(F.q)}" oninput="F.q=this.value;list()" style="flex:1"><button class="b" onclick="mic()" title="Voice search">🎤</button></div></div>
 <div><label>Category</label><select onchange="F.cat=this.value;list()"><option value="">All</option>${sel(CATS,F.cat)}</select></div><div><label>Section</label><select onchange="F.sec=this.value;list()"><option value="">All</option>${sel(SECS,F.sec)}</select></div>
 ${A?`<div><label>Status</label><select onchange="F.st=this.value;list()">${['Approved','Draft','Obsolete',''].map(s=>`<option value="${s}" ${F.st===s?'selected':''}>${s||'All'}</option>`).join('')}</select></div>`:''}
 <div><label><input type="checkbox" ${F.unread?'checked':''} onchange="F.unread=this.checked;list()"> Not read yet</label></div></div>
 ${A?`<p style="margin:8px 0 0"><button class="b p" onclick="form={ver:1};draw()">Add document</button> <button class="b" onclick="csv()">Download master list (CSV)</button></p>`:''}</div><div class="c sc" id="lst"></div>`;list()}
function list(){const q=F.q.toLowerCase().split(/\s+/).filter(Boolean);
 const R=D.filter(d=>(!F.st||d.status===F.st)&&(!F.cat||d.cat===F.cat)&&(!F.sec||d.sec===F.sec)&&q.every(w=>(d.no+' '+d.title+' '+d.cat+' '+d.sec+' '+(d.keywords||'')).toLowerCase().includes(w))&&(!F.unread||(d.status==='Approved'&&!acked(d))))
  .sort((a,b)=>(b.imp?1:0)-(a.imp?1:0)||a.no.localeCompare(b.no)||b.ver-a.ver);
 $('lst').innerHTML=`<table><tr><th>Doc no.</th><th>Title</th><th>Category</th><th>Section</th><th>Ver.</th><th>Effective</th><th>Review due</th><th>Status</th><th></th></tr>${R.map(row).join('')||'<tr><td colspan="9" class="mu">No documents found.</td></tr>'}</table>`}
const row=d=>{const A=me.canEdit,n=d.status==='Approved'?dleft(d.review):null,rc=n==null?'':n<0?'er':n<=60?'wa':'',act=[`<a class="b" href="/api/file?id=${d.file.id}&vote=DOC" target="_blank" style="text-decoration:none">Open</a>`];
 if(d.status==='Approved')act.push(acked(d)?'<span class="ok">Read</span>':`<button class="b p" onclick="ack('${d.id}')">I have read this</button>`);
 if(A){if(d.status==='Draft')act.push(`<button class="b p" onclick="appr('${d.id}')">Approve</button>`);if(d.status==='Approved')act.push(`<button class="b" onclick="obs('${d.id}')">Make obsolete</button>`);act.push(`<button class="b" onclick="nv('${d.id}')">New version</button>`);if(d.status==='Draft')act.push(`<button class="b d" onclick="del('${d.id}')">Delete</button>`);
  if(d.status==='Approved')act.push(`<button class="b" onclick="who('${d.id}')">Read by ${U.filter(u=>K.some(k=>k.doc===d.id&&k.uid===u.id)).length}/${U.length}</button>`)}
 return `<tr><td>${esc(d.no)}</td><td><b>${esc(d.title)}</b>${d.imp?' <span class="tg er">Important</span>':''}<br><small class="mu">${esc(d.change||'')}</small></td><td>${esc(d.cat)}</td><td>${esc(d.sec)}</td><td>v${esc(d.ver)}</td><td>${esc(d.effective||'')}</td><td class="${rc}">${d.status==='Approved'?esc(d.review):''}</td><td><span class="tg">${d.status}</span></td><td>${act.join(' ')}</td></tr>`};
async function ack(id){const d=D.find(x=>x.id===id);await j('/api/doc',{op:'set',path:'isoacks/'+me.id+'_'+id,data:{uid:me.id,doc:id,no:d.no,ver:d.ver,on:today()}});load()}
async function approve(d){for(const o of D.filter(x=>x.no===d.no&&x.id!==d.id&&x.status==='Approved'))await j('/api/doc',{op:'update',path:'isodocs/'+o.id,data:{status:'Obsolete',obsoleteOn:today()}});
 await j('/api/doc',{op:'update',path:'isodocs/'+d.id,data:{status:'Approved',approvedOn:today(),approver:me.id}})}
async function appr(id){const d=D.find(x=>x.id===id);if(!confirm('Approve '+d.no+' v'+d.ver+'? Earlier approved versions become obsolete.'))return;await approve(d);load()}
async function obs(id){if(!confirm('Mark this version obsolete?'))return;await j('/api/doc',{op:'update',path:'isodocs/'+id,data:{status:'Obsolete',obsoleteOn:today()}});load()}
async function del(id){if(!confirm('Delete this draft and its file?'))return;await j('/api/doc',{op:'delete',path:'isodocs/'+id,data:{}});load()}
function who(id){const d=D.find(x=>x.id===id),miss=U.filter(u=>!K.some(k=>k.doc===id&&k.uid===u.id)).map(u=>u.name);alert(d.no+' v'+d.ver+'\n\nNot yet read ('+miss.length+'):\n'+(miss.join('\n')||'nobody'))}
function nv(id){const d=D.find(x=>x.id===id);form={no:d.no,title:d.title,cat:d.cat,sec:d.sec,ver:Math.max(...D.filter(x=>x.no===d.no).map(x=>+x.ver))+1,months:d.months||24,owner:d.owner||'',keywords:d.keywords||'',imp:!!d.imp};draw()}
const formCard=()=>{const f=form;return `<div class="c"><h2>${f.ver>1?'New version':'Add document'}</h2><div class="g">
<div><label>Document no.</label><input id="f_no" value="${esc(f.no||'')}" ${f.ver>1?'readonly':''}></div><div style="grid-column:span 2"><label>Title</label><input id="f_ti" value="${esc(f.title||'')}" style="width:100%"></div>
<div><label>Category</label><input id="f_ca" list="cats" value="${esc(f.cat||'SOP')}"></div><div><label>Section</label><input id="f_se" list="secs" value="${esc(f.sec||'All sections')}"></div>
<div><label>Version</label><input id="f_ve" type="number" value="${f.ver||1}"></div><div><label>Effective date</label><input id="f_ef" type="date" value="${today()}"></div><div><label>Review every (months)</label><input id="f_mo" type="number" value="${f.months||24}"></div>
<div><label>Owner / author</label><input id="f_ow" value="${esc(f.owner||'')}"></div><div style="grid-column:span 2"><label>Keywords</label><input id="f_kw" value="${esc(f.keywords||'')}" style="width:100%"></div>
<div style="grid-column:span 2"><label>What changed</label><input id="f_ch" style="width:100%"></div><div><label>File (PDF, Word, Excel...)</label><input id="f_fi" type="file"></div></div>
<datalist id="cats">${CATS.map(c=>`<option>${c}</option>`).join('')}</datalist><datalist id="secs">${SECS.map(c=>`<option>${c}</option>`).join('')}</datalist>
<p><label><input id="f_im" type="checkbox" ${f.imp?'checked':''}> Important (highlight)</label> &nbsp; <label><input id="f_ap" type="checkbox"> Approve now</label></p>
<p><button class="b p" id="f_sv" onclick="save()">Save</button> <button class="b" onclick="form=null;load()">Cancel</button></p></div>`};
async function save(){const g=i=>$(i).value.trim(),no=g('f_no'),ti=g('f_ti'),ve=+g('f_ve'),fi=$('f_fi').files[0];
 if(!no||!ti||!(ve>0))return alert('Enter the document number, title and version.');if(!fi)return alert('Choose the file to upload.');
 if(D.some(x=>x.no===no&&+x.ver===ve))return alert('That version already exists. Use a higher version number.');
 const b=$('f_sv');b.disabled=true;b.textContent='Uploading...';
 try{const up=await(await fetch('/api/upload?name='+encodeURIComponent(fi.name)+'&vote=DOC',{method:'POST',body:fi})).json();if(!up.id)throw new Error(up.error||'Upload failed');
  const mo=+g('f_mo')||24,ef=g('f_ef')||today(),data={no,title:ti,cat:g('f_ca'),sec:g('f_se'),ver:ve,status:'Draft',effective:ef,months:mo,review:addM(ef,mo),owner:g('f_ow'),keywords:g('f_kw'),change:g('f_ch'),imp:$('f_im').checked,file:{id:up.id,name:up.name,size:up.size},by:me.id,created:today()};
  const r=await j('/api/doc',{op:'add',path:'isodocs',data});if($('f_ap').checked)await approve({...data,id:r.id});form=null;await load()}
 catch(e){alert(e.message);b.disabled=false;b.textContent='Save'}}
function csv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',L=[['Doc no','Title','Category','Section','Version','Status','Effective','Review due','Owner','Approved on'].join(',')];
 D.slice().sort((a,b)=>a.no.localeCompare(b.no)||b.ver-a.ver).forEach(d=>L.push([d.no,d.title,d.cat,d.sec,d.ver,d.status,d.effective,d.review,d.owner,d.approvedOn].map(q).join(',')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv'}));a.download='master-list-'+today()+'.csv';a.click()}
function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Voice search is not supported in this browser.');const r=new SR();r.lang='ms-MY';r.onresult=e=>{F.q=e.results[0][0].transcript;$('qs').value=F.q;list()};r.onerror=e=>alert('Voice search could not start ('+e.error+'). On a plain http address the browser may block the microphone.');r.start()}
boot();</script></body></html>
