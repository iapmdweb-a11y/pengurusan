<script>
/* Intranet adapter: gives the page the same db/user/downloads interface, backed by this server. */
(function(){
const E=id=>document.getElementById(id),subs=[];let ver=0,me=null;
const j=async(u,o)=>{const r=await fetch(u+(u.includes('?')?'&':'?')+'vote='+VOTE,o&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});let t={};try{t=await r.json()}catch(e){}
 if(r.status===401&&u!=='/api/login'){const e=new Error('auth');e.code=401;throw e}if(!r.ok)throw new Error(t.error||'Error '+r.status);return t};
const refresh=async()=>{for(const f of subs)try{await f()}catch(e){}};
setInterval(async()=>{try{const v=(await j('/api/ver')).v;if(v!==ver){ver=v;refresh()}}catch(e){if(e.code===401)location.reload()}},3000);
async function w(op,path,data){try{const r=await j('/api/doc',{op,path,data});refresh();return r}catch(e){alert(e.message);throw e}}
const db={doc:p=>({onSnapshot(cb){const f=async()=>{let d=null;try{d=(await j('/api/doc?path='+encodeURIComponent(p))).data}catch(e){}cb({exists:d!==null,data:()=>d})};subs.push(f);f()},
 set:d=>w('set',p,d),update:d=>w('update',p,d),delete:()=>w('delete',p,{})}),
 collection:c=>({onSnapshot(cb){const f=async()=>{const r=await j('/api/col?name='+c);cb({docs:r.docs.map(x=>({id:x.id,data:()=>x.data}))})};subs.push(f);f()},add:async d=>({id:(await w('add',c,d)).id})})};
const U={id:async()=>me.id,canEdit:()=>me.canEdit,profiles:async ids=>j('/api/names?ids='+ids.join(',')),search:async q=>j('/api/search?q='+encodeURIComponent(q))};
function loginUI(){E('v').innerHTML='<div class="c" style="max-width:340px;margin:40px auto"><h2>Sign in</h2><label>Username</label><input id="lu1" style="width:100%"><label style="margin-top:8px">Password</label><input id="lp1" type="password" style="width:100%"><p><button class="b p" id="lb">Sign in</button></p><p id="le" class="er"></p></div>';
 const go=async()=>{try{await j('/api/login',{username:E('lu1').value,password:E('lp1').value});location.reload()}catch(e){E('le').textContent=e.message}};E('lb').onclick=go;E('lp1').onkeydown=e=>{if(e.key==='Enter')go()}}
window.claude={use:async n=>{
 if(n==='db')return db;
 if(n==='downloads')return{save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;a.click();return{status:'saved'}}};
 if(n==='user'){try{me=await j('/api/me')}catch(e){loginUI();return new Promise(()=>{})}
  if(me.role==='staff'){location.replace('/docs');return new Promise(()=>{})}
  E('bar').innerHTML=me.name+' &middot; <a href="/docs">Dokumen ISO</a> &middot; <a href="/handbook">Panduan &amp; Memo</a> &middot; <a href="#" onclick="chpw();return false">Change password</a> &middot; <a href="#" onclick="outx();return false">Sign out</a>';return U}}};
window.jx=j;window.outx=async()=>{await j('/api/logout',{});location.reload()};
window.chpw=async()=>{const o=prompt('Current password'),n=o&&prompt('New password (8 or more characters)');if(!n)return;try{await j('/api/password',{old:o,new:n});alert('Password changed.')}catch(e){alert(e.message)}};
window.acct=async function(){const us=(await j('/api/users')).users;
 E('v').innerHTML=`<div class="c sc"><h2>Accounts</h2><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${u.role==='admin'?'Admin (PIC / HOD)':u.role==='staff'?'Staff (documents only)':'Unit head'}</td><td>${u.active?'<span class="ok">Active</span>':'<span class="er">Disabled</span>'}</td><td><button class="b" onclick="acr('${u.id}')">Reset password</button> <button class="b d" onclick="acs('${u.id}',${u.active?0:1})">${u.active?'Disable':'Enable'}</button></td></tr>`).join('')}</table></div>
 <div class="c"><h2>New account</h2><div class="g"><div><label>Full name</label><input id="an"></div><div><label>Username</label><input id="au"></div><div><label>Temporary password (8+)</label><input id="ap"></div><div><label>Role</label><select id="ar"><option value="user">Unit head</option><option value="staff">Staff (documents only)</option><option value="admin">Admin (PIC / HOD)</option></select></div><div><button class="b p" onclick="acn()">Create</button></div></div>
 <p class="mu">After creating a unit head, open the Team tab, search for the name and tick their units.</p></div>
 <div class="c"><h2>Backup</h2><p class="mu" style="margin:0 0 8px">Downloads a full copy of all data. Keep copies somewhere safe.</p><a class="b" href="/api/backup" style="text-decoration:none;display:inline-block">Download backup</a> <a class="b" href="/api/export?vote=${VOTE}" style="text-decoration:none;display:inline-block">Export data file (keep inside the hospital)</a></div>`};
window.acn=async()=>{try{await j('/api/users',{action:'create',name:E('an').value,username:E('au').value,password:E('ap').value,role:E('ar').value});acct()}catch(e){alert(e.message)}};
window.acr=async id=>{const p=prompt('New password for this person (8 or more characters)');if(!p)return;try{await j('/api/users',{action:'reset',id,password:p});alert('Password reset. They are signed out.')}catch(e){alert(e.message)}};
window.acs=async(id,a)=>{try{await j('/api/users',{action:'active',id,active:a});acct()}catch(e){alert(e.message)}};
})();
</script>
<script>
const $=id=>document.getElementById(id);
const R=n=>'RM '+(+n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let U,db,ME,ADMIN=false,tab='dash',names={},S={joins:[],recon:[],counts:[],items:[],moves:[],warrants:[],cfg:null,lpos:[],reqs:[],mem:null,members:[]},hits=[];
async function init(){
 try{U=await claude.use('user');db=await claude.use('db')}catch(e){}
 if(!U||!db){$('v').innerHTML='<div class="c">Please open this page while signed in to claude.ai. Ask the account PIC to share it with you.</div>';return}
 ME=await U.id();ADMIN=U.canEdit();
 db.doc('config/main').onSnapshot(s=>{S.cfg=s.exists?s.data():null;draw()});
 db.doc('members/'+ME).onSnapshot(s=>{S.mem=s.exists?s.data():null;draw()});
 db.collection('lpos').onSnapshot(s=>{S.lpos=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
 db.collection('warrants').onSnapshot(s=>{S.warrants=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
 db.collection('items').onSnapshot(s=>{S.items=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
 db.collection('moves').onSnapshot(s=>{S.moves=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
 db.collection('counts').onSnapshot(s=>{S.counts=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
 db.collection('reqs').onSnapshot(s=>{S.reqs=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
 if(ADMIN)db.collection('joins').onSnapshot(s=>{S.joins=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
 if(ADMIN)db.collection('recon').onSnapshot(s=>{S.recon=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
 if(ADMIN)db.collection('members').onSnapshot(s=>{S.members=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
}
const cfg=()=>S.cfg,units=()=>S.cfg.units||[];
const mine=()=>ADMIN?units().map(u=>u.n):(S.mem&&S.mem.units)||[];
const vis=n=>mine().includes(n);
const lastTot=()=>units().reduce((a,u)=>a+(+u.last||0),0)||1;
const pct=u=>(+u.last||0)/lastTot()*100;
const alloc=u=>pct(u)/100*cfg().budget+(+u.top||0);
const val=l=>l.inv!=null&&l.inv!==''?+l.inv:+l.lpo;
const used=n=>S.lpos.filter(l=>l.unit===n&&l.st==='Active'&&(!l.src||l.src==='budget')).reduce((a,l)=>a+val(l),0);
const SI=()=>S.items.filter(i=>ADMIN||vis(i.unit));
const rcv=l=>S.moves.filter(m=>m.type==='in'&&(m.lpo||'').toUpperCase()===l.no.toUpperCase()).reduce((a,m)=>a+m.qty*m.price,0);
function bal(i,d){let b=+i.open||0,v=null,vd='';S.moves.filter(m=>m.item===i.id&&(!d||(m.date||'')<=d)).sort((x,y)=>x.ts-y.ts).forEach(m=>{if(m.type==='in')b+=m.qty;else if(m.type==='out'||m.type==='waste')b-=m.qty;else{v=m.qty-b;vd=m.date;b=m.qty}});return{b,v,vd}}
const W=()=>S.warrants.filter(w=>ADMIN||vis(w.unit));
const wused=id=>S.lpos.filter(l=>l.src===id&&l.st==='Active').reduce((a,l)=>a+val(l),0);
const held=n=>S.lpos.filter(l=>l.unit===n&&l.st==='Held'&&(!l.src||l.src==='budget')).reduce((a,l)=>a+val(l),0);
async function nm(ids){ids=ids.filter(i=>i&&!names[i]);if(!ids.length)return;try{const p=await U.profiles(ids);ids.forEach(i=>names[i]=(p[i]&&p[i].name)||'User');draw()}catch(e){}}
function alerts(){const a=[],L=S.lpos.filter(l=>vis(l.unit)),seen={};
L.forEach(l=>(seen[l.no.trim().toUpperCase()]=seen[l.no.trim().toUpperCase()]||[]).push(l));
Object.values(seen).forEach(g=>{if(g.length>1)a.push(['e',`Duplicate LPO ${esc(g[0].no)} appears ${g.length} times. Do not send twice to the PIC.`])});
S.reqs.filter(r=>r.st==='Pending'&&vis(r.unit)).forEach(r=>a.push(['e',`Extra budget request pending: ${esc(r.unit)} needs ${R(r.amt)} (LPO ${esc(r.no)}). Reason: ${esc(r.reason)}`]));
if(ADMIN)L.filter(l=>!l.ack&&l.st!=='Rejected').forEach(l=>a.push(['e',`New purchase not yet recorded in the account: ${esc(l.unit)}, LPO ${esc(l.no)}, ${R(l.lpo)}, ${esc(l.item)}.`]));
L.filter(l=>l.inv!=null&&l.inv!==''&&Math.abs(l.inv-l.lpo)>0.005).forEach(l=>a.push(['w',`Amount not tallied: LPO ${esc(l.no)} was ${R(l.lpo)} but invoice is ${R(l.inv)} (difference ${R(l.inv-l.lpo)}).`]));
L.filter(l=>l.st==='Active'&&(l.inv==null||l.inv==='')&&(Date.now()-new Date(l.date))/864e5>30).forEach(l=>a.push(['w',`LPO ${esc(l.no)} (${esc(l.unit)}) has no invoice after 30+ days.`]));
const el=Math.min(1,Math.max(0,(Date.now()-new Date(cfg().year,0,1))/(new Date(cfg().year,11,31)-new Date(cfg().year,0,1))))*100;
units().filter(u=>vis(u.n)).forEach(u=>{const al=alloc(u),us=used(u.n),p=al?us/al*100:0;
if(p>100)a.push(['e',`${esc(u.n)} is OVER its allocation by ${R(us-al)}. Approval needed.`]);
else if(p>=80)a.push(['w',`${esc(u.n)} has used ${p.toFixed(0)}% of its allocation. ${R(al-us)} left.`]);
else if(p>el+15&&el>5)a.push(['w',`${esc(u.n)} is spending faster than the calendar: ${p.toFixed(0)}% used, ${el.toFixed(0)}% of the year gone.`])});
if(ADMIN){const now=new Date(),m=now.getMonth(),py=m===0?now.getFullYear()-1:now.getFullYear(),pm=py+'-'+String(m===0?12:m).padStart(2,'0');
if(py===+cfg().year&&now.getDate()>=10){const miss=units().filter(u=>!rc(pm,u.n));if(miss.length)a.push(['w',`${pm} has not been reconciled with the official ledger for: ${miss.map(u=>esc(u.n)).join(', ')}.`])}
units().forEach(u=>{const r=S.recon.filter(x=>x.unit===u.n).sort((x,y)=>y.month.localeCompare(x.month))[0];if(r){const d=r.official-trk(u.n,r.month);if(Math.abs(d)>.5)a.push(['e',`${esc(u.n)}: official ledger and tracker differ by ${R(d)} as at ${r.month}.`])}})}
const miss={};S.moves.filter(m=>m.type==='in'&&!m.lk&&(m.date||'')>=new Date(Date.now()-30*864e5).toISOString().slice(0,10)).forEach(m=>{const i=SI().find(x=>x.id===m.item);if(i&&!i.noexp)miss[i.n]=(miss[i.n]||0)+1});
Object.keys(miss).forEach(n=>a.push(['w',`${esc(n)}: ${miss[n]} delivery(ies) in the last 30 days recorded without lot number and expiry date.`]));
lotRows().forEach(r=>{const u=esc(r.i.n)+' ('+esc(r.i.unit)+'), lot '+esc(r.x.lot);
if(r.d!=null&&r.d<0)a.push(['e',`${u} expired on ${esc(r.x.exp)} with ${r.x.rem} ${esc(r.i.uom)} left (${R(r.x.rem*r.pr)}). Discard it and record the discard.`]);
else if(r.d!=null&&r.d<=(cfg().exd||60))a.push(['w',`${u} expires in ${r.d} days, ${r.x.rem} ${esc(r.i.uom)} left${r.waste>=.5?`. Likely to expire before use, estimated waste ${R(r.waste*r.pr)}`:''}.`])});
SI().forEach(i=>{const x=bal(i);if(x.b<0)a.push(['e',`${esc(i.n)} (${esc(i.unit)}): more issued than received. Balance ${x.b}.`]);else if(x.b<=i.reorder)a.push(['w',`${esc(i.n)} (${esc(i.unit)}) is at or below reorder level: ${x.b} ${esc(i.uom)} left.`]);if(x.v)a.push(['e',`${esc(i.n)}: last stock count differs from records by ${x.v>0?'+':''}${x.v} ${esc(i.uom)} (${esc(x.vd)}). Investigate.`]);const k=stk(i);if(k.st==='Low')a.push([k.dos<7?'e':'w',`${esc(i.n)} (${esc(i.unit)}): about ${Math.round(k.dos)} days of stock left at current use.`]);else if(k.st==='Overstocked')a.push(['w',`${esc(i.n)} (${esc(i.unit)}): about ${Math.round(k.dos)} days of stock on hand. Over-ordering ties up money and risks expiry.`])});
L.filter(l=>l.st==='Active'&&rcv(l)>0&&Math.abs(rcv(l)-val(l))>0.005*val(l)).forEach(l=>a.push(['w',`LPO ${esc(l.no)}: goods received are worth ${R(rcv(l))} but the ${l.inv!=null&&l.inv!==''?'invoice':'LPO'} is ${R(val(l))} (partial delivery?).`]));
W().forEach(w=>{const u=wused(w.id),p=w.amt?u/w.amt*100:0,d=(new Date(w.expiry)-Date.now())/864e5,left=w.amt-u;
if(p>=80)a.push(['w',`Warrant "${esc(w.name)}" is ${p.toFixed(0)}% used, ${R(left)} left.`]);
if(w.expiry&&d<0&&left>0)a.push(['e',`Warrant "${esc(w.name)}" has expired with ${R(left)} unspent.`]);
else if(w.expiry&&d<=30&&left>0)a.push(['w',`Warrant "${esc(w.name)}" expires in ${Math.ceil(d)} days with ${R(left)} unspent.`])});
return a}
function nav(){const pn=S.reqs.filter(r=>r.st==='Pending'&&vis(r.unit)).length;
const t=[['dash','Dashboard'],['lpo','LPO Register'],['req','Requests'+(pn?' ('+pn+')':'')],['warr','Warrants'],['stock','Stock'],...(APP.tests?[['tests','Cost per test']]:[])];if(ADMIN)t.push(['rev','Mid-term review'],['recon','Reconcile'],['team','Team'],['acct','Accounts'],['set','Setup']);
$('tabs').innerHTML=t.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';draw()">${x[1]}</button>`).join('')}
function draw(){
 if(!U||!db)return;
 if(!S.cfg){$('v').innerHTML='<div class="c">'+(ADMIN?'Budget not set up yet. Ask Claude to seed the setup.':'Waiting for the account PIC to set up the budget.')+'</div>';return}
 if(!ADMIN&&!mine().length){$('tabs').innerHTML='';$('v').innerHTML=joinView();return}
 $('who').textContent=ADMIN?'Signed in as admin (PIC / HOD): full access':'Unit head: '+mine().join(', ');
 nav();({dash,lpo,req,warr,stock,tests,recon,acct,rev,team,set})[tab]();
 nm([...S.lpos.map(l=>l.by),...S.members.map(m=>m.id)])}
function dash(){const us=units().filter(u=>vis(u.n)),tu=us.reduce((a,u)=>a+used(u.n),0),ta=us.reduce((a,u)=>a+alloc(u),0),A=alerts();
$('v').innerHTML=`<div class="c"><div class="k"><div>${ADMIN?'Annual budget':'Your allocation'}<b>${R(ADMIN?cfg().budget:ta)}</b></div><div>Spent / committed<b>${R(tu)}</b></div><div>Remaining<b class="${ta-tu<0?'er':''}">${R(ta-tu)}</b></div><div>Alerts<b class="${A.length?'er':'ok'}">${A.length}</b></div></div></div>
<div class="c"><h2>Alerts</h2>${A.length?A.map(x=>`<div class="al ${x[0]}">${x[1]}</div>`).join(''):'<div class="al i">All clear.</div>'}</div>
<div class="c sc"><h2>Units</h2><table><tr><th>Unit</th><th>Share</th><th>Allocation</th><th>Used</th><th>Held</th><th>Left</th><th>Usage</th></tr>${us.map(u=>{const al=alloc(u),x=used(u.n),p=al?x/al*100:0,col=p>100?'var(--er)':p>=80?'var(--wa)':'var(--ok)';return`<tr><td>${esc(u.n)}${u.res?' <span class="tg">Reserve</span>':''}</td><td>${pct(u).toFixed(1)}%</td><td>${R(al)}</td><td>${R(x)}</td><td>${held(u.n)?R(held(u.n)):'-'}</td><td class="${al-x<0?'er':''}">${R(al-x)}</td><td><div class="bar"><i style="width:${Math.min(100,p)}%;background:${col}"></i></div><small class="mu">${p.toFixed(0)}%</small></td></tr>`}).join('')}</table></div>`}

<table><tr><th>Unit</th><th>${cfg().year} spent</th><th>Share basis (RM)</th><th>Share</th><th>New allocation</th></tr>${units().map((u,i)=>`<tr><td>${esc(u.n)}${u.res?' <span class="tg">Reserve</span>':''}</td><td>${R(sp[i])}</td><td><input type="number" class="nyl" style="width:120px" value="${Math.round(sp[i])}" oninput="nyp()"></td><td class="nys"></td><td class="nya"></td></tr>`).join('')}</table>
<p class="mu">The share basis starts as ${cfg().year} actual spending. Change it if allocations follow another rule, for example a fixed amount for a reserve.</p>
<label><input type="checkbox" id="ny3"> I have recorded the December stock count and will keep the backup that downloads.</label>
<p><button class="b p" onclick="nyGo()">Start new year</button> <button class="b" onclick="ny=false;draw()">Cancel</button></p></div>`};
function nyp(){const L=[...document.querySelectorAll('.nyl')].map(x=>+x.value||0),t=L.reduce((a,x)=>a+x,0)||1,b=+$('ny2').value||0;document.querySelectorAll('.nys').forEach((e,i)=>e.textContent=(L[i]/t*100).toFixed(1)+'%');document.querySelectorAll('.nya').forEach((e,i)=>e.textContent=R(L[i]/t*b))}
async function nyGo(){const y=+$('ny1').value,b=+$('ny2').value,L=[...document.querySelectorAll('.nyl')].map(x=>+x.value||0);
if(!(y>2000)||!(b>0))return alert('Enter the new year and the total budget.');if(!L.some(x=>x>0))return alert('Enter the share basis amounts.');if(!$('ny3').checked)return alert('Please tick the box to confirm.');
if(!confirm('Start '+y+'? The old records are archived and a backup downloads first.'))return;
const a=document.createElement('a');a.href='/api/backup';a.click();await new Promise(r=>setTimeout(r,2500));
try{await jx('/api/newyear',{year:y,budget:b,units:units().map((u,i)=>({n:u.n,last:L[i],res:!!u.res}))});ny=false;alert('New year started.');location.reload()}catch(e){alert(e.message)}}
function modal(h){const d=document.createElement('div');d.className='m';d.id='mo';d.innerHTML='<div>'+h+'</div>';document.body.appendChild(d)}
function closeM(){const m=$('mo');m&&m.remove()}
(function(){const el=document.getElementById('votes'),mk=(v,l)=>v===APP.vote?'<b>'+l+'</b>':'<a href="#" onclick="setVote(\''+v+'\');return false">'+l+'</a>';el.innerHTML='Budget vote: '+mk('27403','Reagents (27403)')+' &middot; '+mk('27499','Consumables (27499)')})();
document.getElementById('ttl').textContent='🧪 Pengurusan Patologi: Bajet';document.title='Pengurusan Patologi';
init();
</script></body></html>
